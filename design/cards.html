<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Pass Cards</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../vendor/holo/holo.css">
<style>
  /* Old card on the left, new on the right, the reason underneath. Art comes from the main checkout's local server (port 8123). */
  body { padding: 16px; background: var(--bg, #eef1f7); }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  .intro { max-width: 70ch; margin: 0 0 12px; opacity: .8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 18px; }
  .pair { background: rgba(255,255,255,.55); border-radius: 14px; padding: 10px; }
  .row { display: flex; gap: 8px; align-items: flex-start; justify-content: center; }
  .row .card { width: 150px; flex: none; }
  .lbl { display: flex; justify-content: space-around; font-size: 11px; font-weight: 800; letter-spacing: .06em; opacity: .55; margin-bottom: 4px; }
  .why { font-size: 12.5px; line-height: 1.35; margin: 8px 2px 0; }
  .arrow { align-self: center; font-size: 20px; opacity: .4; }
</style>
</head>
<body>
<h1>Design pass: every changed card</h1>
<p class="intro">Old card on the left, new on the right, drawn with the game’s own renderCard. Evils are retired; each became an Item with a set number of turns or uses (the tag at the bottom). Character rules text is kept short enough for the small card.</p>
<div id="out"></div>
<script src="../js/cards-data.js"></script>
<script src="../js/card-overrides.js"></script>
<script src="../js/cards.js"></script>
<script src="../js/assets.js"></script>
<script src="../js/render.js"></script>
<script src="cards-old.js"></script>
<script>
const ART = 'http://localhost:8123/'; // the main checkout's server has art/local (never copied here)
const fix = c => (c.art && !/^https?:/.test(c.art) ? { ...c, art: ART + c.art } : c);
// old cards keep their old card number
const groups = [['Evils retired: the Items that replaced them', id => /^item_/.test(id)], ['Characters reworked (new hook)', id => !/^item_|^captain_/.test(id) && /Bland|Text fix/.test(PAIRS.find(p => p[0] === id)[2])],
  ['Boredom riders removed', id => !/^item_|^captain_/.test(id) && !/Bland|Text fix/.test(PAIRS.find(p => p[0] === id)[2])], ['Captain Supers', id => /^captain_/.test(id)]];
document.getElementById('out').innerHTML = groups.map(([title, test]) => `<h2>${title}</h2><div class="grid">${PAIRS.filter(p => test(p[0])).map(([o, n, why]) => {
  const oc = fix({ ...OLD[o], no: CARD[n].no }), nc = fix(CARD[n]);
  return `<div class="pair"><div class="lbl"><span>BEFORE</span><span>AFTER</span></div><div class="row">${renderCard(oc)}<span class="arrow">→</span>${renderCard(nc)}</div><p class="why">${why}</p></div>`;
}).join('')}</div>`).join('');
</script>
</body>
</html>
