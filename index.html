<html translate="no" lang="en">
<head>

<title>Tismtopia TCG</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/holo/holo.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e9edf5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<main id="app" class="screen app"></main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/cards-data.js"></script>
  <script src="js/card-overrides.js"></script>

<script src="js/audio.js"></script>
<script>
// Installable app (needs https or localhost). On plain http over home Wi-Fi, the first tap goes full screen instead.
if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('sw.js');
if (matchMedia('(pointer: coarse)').matches && !matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches)
  addEventListener('pointerup', () => document.documentElement.requestFullscreen?.().catch(() => {}), { once: true });
</script>
</body>
