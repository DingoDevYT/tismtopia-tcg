<!doctype html>
<html translate="no" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9edf5">
<script>
// Dark mode before the first paint, so there is no white flash: the saved choice (store key 'theme', see js/audio.js), else the system setting.
(() => { let t; try { t = JSON.parse(localStorage.getItem('tismtopia.theme')); } catch { /* storage off */ }
  if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
  if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#1b1f2a'; })();
</script>
<title>Tismtopia TCG</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/holo/holo.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="art/icon-192.png">
</head>
<body>
<main id="app" class="screen app"></main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/cards-data.js"></script>
  <script src="js/card-overrides.js"></script>
  <script src="js/cards.js"></script>
<script src="js/assets.js"></script>
<script src="js/render.js"></script>
<script src="js/rainbow.js"></script>
<script src="js/game.js"></script>
<script src="js/app.js"></script>
<script src="js/pack-sets.js"></script>
<script src="js/packs.js"></script>
<script src="js/economy.js"></script>
<script src="js/audio.js"></script>
<script src="js/cardfile.js"></script>
<script src="js/art-tools.js"></script>
<script src="js/cloud.js"></script>
<script src="js/profile.js"></script>
<script src="js/submit.js"></script>
<script src="js/community.js"></script>
<script src="js/review.js"></script>
<script src="js/onboard.js"></script>
<script src="js/tour.js"></script>
<script>
// Installable app (needs https or localhost). On plain http over home Wi-Fi, the first tap goes full screen instead.
if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('sw.js');
if (matchMedia('(pointer: coarse)').matches && !matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches)
  addEventListener('pointerup', () => document.documentElement.requestFullscreen?.().catch(() => {}), { once: true });
</script>
</body>
</html>
