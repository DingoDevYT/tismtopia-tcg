<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tismtopia TCG · Player bar options</title>
<link rel="stylesheet" href="style.css">
<style>
  body.mock { background: #24272f; padding: 28px 16px 60px; }
  .mock > h1 { color: #fff; text-align: center; font-size: 24px; font-weight: 800; }
  .mock > p { color: #a3a9b8; text-align: center; margin: 6px auto 26px; font-size: 14px; font-weight: 500; max-width: 680px; }
  .opt { display: grid; gap: 10px; justify-items: center; margin-bottom: 36px; }
  .opt h2 { color: #fff; margin: 0; }
  .opt p { color: #c4c9d6; font-size: 14px; font-weight: 500; max-width: 760px; text-align: center; }
  .clip { width: 896px; height: 560px; overflow: hidden; border-radius: 16px; box-shadow: 0 20px 50px rgba(0, 0, 0, .45), 0 0 0 6px #15171c; }
  .clip .screen { width: 1280px; height: 800px; max-width: none; transform: scale(.7); transform-origin: 0 0; }

  /* ---- A: side panel ---- */
  .v-a .hudA { width: 280px; padding: 16px 18px; border-radius: 26px; display: grid; gap: 12px; }
  .hA-head { display: flex; align-items: center; gap: 12px; }
  .hA-head .avatar { width: 56px; height: 56px; }
  .hA-head b { display: block; font-size: 18px; }
  .hA-pts { display: flex; align-items: center; gap: 5px; }
  .hA-pts .i { width: 28px; height: 28px; color: #d0d6e1; }
  .hA-pts .on .i { color: var(--gold); filter: drop-shadow(0 1px 1px rgba(120, 80, 0, .35)); }
  .hA-pts em { margin-left: auto; font-style: normal; font-weight: 800; color: var(--muted); }
  .hA-meter { display: grid; grid-template-columns: 1fr auto; gap: 5px 8px; align-items: center; font-size: 14px; }
  .hA-meter > span { display: flex; align-items: center; gap: 6px; }
  .hA-meter > span .i { width: 18px; height: 18px; }
  .hA-meter.goof > span .i, .hA-meter.goof b { color: #f0941c; }
  .hA-meter.bore > span .i, .hA-meter.bore b { color: #67779a; }
  .hA-bar { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .hA-bar i { height: 14px; border-radius: 7px; box-shadow: var(--inset); }
  .goof .hA-bar i.on { background: linear-gradient(90deg, #ffbe3d, #f0941c); box-shadow: 0 0 8px rgba(240, 148, 28, .5); }
  .bore .hA-bar i.on { background: linear-gradient(90deg, #a3b0c7, #67779a); box-shadow: none; }

  /* ---- B: fighting-game strips across the board ---- */
  .v-b .board { grid-template-rows: 40px auto 1fr auto 1fr auto auto;
    grid-template-areas: "oh oh oh" "ohud ohud ohud" ". ofield ofx" "mid mid mid" ". yfield yfx" "yhud yhud yhud" "hand hand hand"; }
  .v-b .side:nth-child(2) > .hud, .v-b .side:nth-child(4) > .hud { align-self: center; margin: 6px 0; }
  .v-b .hudB { display: flex; align-items: center; gap: 22px; padding: 10px 26px 10px 10px; border-radius: 999px; }
  .hudB .avatar { width: 56px; height: 56px; }
  .hB-who { min-width: 150px; }
  .hB-who b { display: block; font-size: 18px; }
  .hB-meter { flex: 1; display: grid; gap: 5px; }
  .hB-lab { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .hB-lab .i { width: 18px; height: 18px; }
  .hB-lab b { margin-left: auto; font-size: 16px; }
  .goof .hB-lab .i, .goof .hB-lab b { color: #f0941c; }
  .bore .hB-lab .i, .bore .hB-lab b { color: #67779a; }
  .hB-bar { position: relative; height: 18px; border-radius: 9px; box-shadow: var(--inset); overflow: hidden; }
  .hB-bar i { display: block; height: 100%; border-radius: 9px; }
  .hB-bar::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(20% - 2px), var(--surface) calc(20% - 2px) 20%); }
  .goof .hB-bar i { background: linear-gradient(90deg, #ffbe3d, #f0941c); }
  .bore .hB-bar i { background: linear-gradient(90deg, #a3b0c7, #67779a); }
  .hB-pts { display: grid; justify-items: center; gap: 2px; }
  .hB-pts div { display: flex; gap: 4px; }
  .hB-pts .i { width: 30px; height: 30px; color: #d0d6e1; }
  .hB-pts .on .i { color: var(--gold); filter: drop-shadow(0 1px 1px rgba(120, 80, 0, .35)); }

  /* ---- C: avatar ring gauges ---- */
  .v-c .hudC { display: flex; align-items: center; gap: 16px; padding: 12px 22px 12px 12px; border-radius: 80px 26px 26px 80px; }
  .ring { position: relative; width: 124px; height: 124px; flex: none; display: grid; place-items: center; }
  .ring svg { position: absolute; inset: 0; }
  .ring path { fill: none; stroke-width: 9; stroke-linecap: round; stroke: #d3d9e4; }
  .ring .goof.on { stroke: #f0941c; }
  .ring .bore.on { stroke: #67779a; }
  .ring .avatar { width: 84px; height: 84px; box-shadow: var(--raise-sm); }
  .hC-info b { display: block; font-size: 18px; }
  .hC-pts { display: flex; gap: 4px; margin: 8px 0 6px; }
  .hC-pts .i { width: 26px; height: 26px; color: #d0d6e1; }
  .hC-pts .on .i { color: var(--gold); filter: drop-shadow(0 1px 1px rgba(120, 80, 0, .35)); }
  .hC-legend { display: flex; gap: 14px; font-size: 14px; }
  .hC-legend span { display: flex; align-items: center; gap: 5px; }
  .hC-legend .i { width: 17px; height: 17px; }
  .hC-legend .goof { color: #f0941c; }
  .hC-legend .bore { color: #67779a; }
</style>
</head>
<body class="mock">
<h1>Player bar: pick a direction</h1>
<p>Same board, same moment in a game (Pip: 1 point, 1 Goofiness, 4 Boredom · Juno: 2 points, 3 Goofiness, 1 Boredom). Only the player bars change. Phone gets a squashed version of whichever you pick.</p>
<div id="opts"></div>
<script src="js/cards.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script>
const S = { turn: 0, turnNo: 3, actions: 1, phase: 'play', capUsed: false,
  players: [
    { name: 'Juno', captain: 'cap_gremlin', points: 2, goof: 3, bore: 1, deck: Array(9), hand: ['c_reply_guy', 'b_ping', 'm_sticker', 'e_slowmode', 'b_voice_crack'],
      field: [{ id: 'c_vc_goblin', hp: 3, t: 1 }, { id: 'c_night_owl', hp: 1, t: 1 }], effects: [{ id: 'b_brainrot', turns: 1 }] },
    { name: 'Pip', captain: 'cap_lurker', points: 1, goof: 1, bore: 4, deck: Array(10), hand: Array(4).fill('c_lagger'),
      field: [{ id: 'c_lagger', hp: 2, t: 1 }, { id: 'c_reply_guy', hp: 4, t: 1 }, { id: 'c_vc_goblin', hp: 2, t: 1 }], effects: [{ id: 'e_read' }] },
  ] };
const five = (n, cls = '') => Array.from({ length: 5 }, (_, i) => `<span class="${cls}${i < n ? ' on' : ''}">${ICON.point}</span>`).join('');
const segs = n => Array.from({ length: 5 }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('');
const who = p => `<div><b>${p.name}</b><small>${CARD[p.captain].name}</small></div>`;

const HUDS = {
  a: p => `<div class="hud hudA neu"><div class="hA-head">${renderAvatar(CARD[p.captain])}${who(p)}</div>
    <div class="hA-pts">${five(p.points)}<em>${p.points}/5</em></div>
    ${['goof', 'bore'].map(k => `<div class="hA-meter ${k}"><span>${ICON[k]}${k === 'goof' ? 'Goofiness' : 'Boredom'}</span><b>${p[k]}/5</b><div class="hA-bar">${segs(p[k])}</div></div>`).join('')}</div>`,
  b: p => `<div class="hud hudB neu">${renderAvatar(CARD[p.captain])}<div class="hB-who">${who(p).slice(5, -6)}</div>
    ${['goof', 'bore'].map(k => `<div class="hB-meter ${k}"><div class="hB-lab">${ICON[k]}${k === 'goof' ? 'Goofiness' : 'Boredom'}<b>${p[k]}/5</b></div><div class="hB-bar"><i style="width:${p[k] * 20}%"></i></div></div>`).join('')}
    <div class="hB-pts"><small>Points</small><div>${five(p.points)}</div></div></div>`,
  c: p => {
    // 5 arc segments each side: Goofiness up the left, Boredom up the right
    const arc = (a0, a1) => { const pt = a => [62 + 56 * Math.cos(a * Math.PI / 180), 62 + 56 * Math.sin(a * Math.PI / 180)].map(v => v.toFixed(1)).join(' '); return `M${pt(a0)} A56 56 0 0 ${a1 > a0 ? 1 : 0} ${pt(a1)}`; };
    const side = (k, start, dir) => Array.from({ length: 5 }, (_, i) => `<path class="${k}${i < p[k] ? ' on' : ''}" d="${arc(start + dir * (i * 32 + 4), start + dir * (i * 32 + 28))}"/>`).join('');
    return `<div class="hud hudC neu"><div class="ring"><svg viewBox="0 0 124 124">${side('goof', 100, 1)}${side('bore', 80, -1)}</svg>${renderAvatar(CARD[p.captain])}</div>
      <div class="hC-info">${who(p).slice(5, -6)}<div class="hC-pts">${five(p.points)}</div>
      <div class="hC-legend"><span class="goof">${ICON.goof}${p.goof}/5</span><span class="bore">${ICON.bore}${p.bore}/5</span></div></div></div>`;
  },
};
const INFO = {
  a: ['A · Side panel', 'Each player gets a proper card-sized panel in the left column: big coins with "2/5", and labelled, chunky Goofiness/Boredom bars with numbers. Most readable; uses the empty side space.'],
  b: ['B · Fighting-game bars', 'A full-width strip above each half, like health bars in a fighter: wide labelled bars you can read from across the room, points as big coins on the end. Most dramatic; takes a bit of board height.'],
  c: ['C · Avatar rings', 'Your Captain portrait wrapped in a ring: Goofiness fills up the left side, Boredom up the right, points as coins beside it. Closest to the Pokemon Pocket look; most compact, slightly less obvious at a glance.'],
};
document.getElementById('opts').innerHTML = Object.keys(HUDS).map(k => {
  renderHud = HUDS[k];
  return `<section class="opt"><h2>${INFO[k][0]}</h2><p>${INFO[k][1]}</p><div class="clip"><div class="screen app v-${k}">${renderBoard(S, 0, { glow: [0] })}</div></div></section>`;
}).join('');
</script>
</body>
</html>
