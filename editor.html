<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Editor</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/holo/holo.css">
<style>
  body { font: 14px system-ui; margin: 16px; background: #eee; overflow: auto !important; height: auto !important; }
  .vars { display: flex; gap: 6px; overflow-x: auto; } .vars .card { width: 160px; flex: none; position: relative; }
  #grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .c { background: #fff; padding: 8px; border-radius: 8px; }
  .pic { width: 100%; aspect-ratio: 4/3; overflow: hidden; border-radius: 4px; background: #ccc; }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  label { display: block; font-size: 12px; } input[type=range] { width: 100%; }
</style>
<p>Chrome/Edge on PC. <button id="open">1. Open the Tismtopia TCG folder</button> <button id="save" disabled>2. Save</button> <span id="msg"></span></p>
<div id="grid"></div>
<script src="js/cards-data.js"></script>
<script src="js/card-overrides.js"></script>
<script src="js/cards.js"></script>
<script src="js/render.js"></script>
<script>
// Edits js/card-overrides.js and writes uploads to art/local/ through the browser's folder access.
let dir = null;
const all = [...CAPTAINS, ...CARDS], ov = structuredClone(OVERRIDES), $ = s => document.querySelector(s);
const get = id => (ov[id] ||= {});
function draw() {
  $('#grid').innerHTML = all.map(c => { const cr = c.crop || { x: 50, y: 50, zoom: 1 };
    return `<div class="c" data-id="${c.id}"><b>${c.name}</b> <small>${c.type}</small>
    <div class="vars">${(c.type === 'character' ? ['', 'v-holo', 'v-rev', 'v-full'] : ['']).map(v => renderCard(c, { cls: v })).join('')}</div>
    <label>X <input type="range" min="0" max="100" value="${cr.x}" data-k="x"></label>
    <label>Y <input type="range" min="0" max="100" value="${cr.y}" data-k="y"></label>
    <label>Zoom <input type="range" min="1" max="3" step="0.05" value="${cr.zoom}" data-k="zoom"></label>
    ${c.type === 'character' ? `<label><input type="checkbox" data-k="rainbow" ${c.rainbow ? 'checked' : ''}> Rainbow full art</label>` : ''}
    <label>Replace image <input type="file" accept="image/*"></label></div>`; }).join('');
}
$('#grid').addEventListener('input', async e => {
  const el = e.target, id = el.closest('.c').dataset.id, c = all.find(x => x.id === id), k = el.dataset.k;
  if (el.type === 'file') {
    if (!dir) return alert('Open the folder first');
    const f = el.files[0], name = `${id}-custom.${f.name.split('.').pop().toLowerCase()}`;
    const fh = await (await (await dir.getDirectoryHandle('art')).getDirectoryHandle('local', { create: true })).getFileHandle(name, { create: true });
    const w = await fh.createWritable(); await w.write(f); await w.close();
    c.art = get(id).art = `art/local/${name}?v=${Date.now()}`;
  } else if (k === 'rainbow') c.rainbow = get(id).rainbow = el.checked;
  else { c.crop = get(id).crop = { ...(c.crop || { x: 50, y: 50, zoom: 1 }), [k]: +el.value }; }
  draw();
});
$('#open').onclick = async () => { dir = await showDirectoryPicker({ mode: 'readwrite' }); $('#save').disabled = false; $('#msg').textContent = 'Folder open'; };
$('#save').onclick = async () => {
  const fh = await (await dir.getDirectoryHandle('js')).getFileHandle('card-overrides.js');
  const w = await fh.createWritable();
  await w.write(`// Written by editor.html: per-card art, crop and rainbow full-art overrides, applied on top of cards-data.js.\nconst OVERRIDES = ${JSON.stringify(ov, null, 1)};\nfor (const c of [...CAPTAINS, ...CARDS]) Object.assign(c, OVERRIDES[c.id] || {});\n`);
  await w.close(); $('#msg').textContent = 'Saved ' + new Date().toLocaleTimeString();
};
draw();
</script>
